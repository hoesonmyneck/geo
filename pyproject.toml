[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geo-geocoder"
version = "0.1.0"
description = "Batch geocoder for Kazakhstan addresses using local Nominatim + Photon"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "openpyxl>=3.1.2",
    "pyarrow>=16.0.0",
    "tenacity>=8.4.0",
    "tqdm>=4.66.0",
    "rapidfuzz>=3.9.0",
    "psycopg[binary]>=3.1.0",
    "pandas>=2.2.0",
    "click>=8.1.7",
]

[project.scripts]
geocode = "src.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
